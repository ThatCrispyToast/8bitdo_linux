<title>Retro Config</title>
<style>
/*__FONTS__*/
:root{
  --plastic:#d3cfc6; --paper:#f1efe9; --paper-2:#e5e1d9; --ink:#1d1c1a; --ink-soft:#5a5751; --line:#a8a399;
  --dark:#3e3d3f; --dark-2:#2c2b2d; --on-dark:#f1efe9; --on-dark-soft:#b9b5ad;
  --red:#d7261e; --red-ink:#a3170f; --on-red:#fff8f6; --good:#2f8f4e; --warn:#c98a12;
  --case:#bdb8ae; --key-light:#e3dfd7; --key-light-edge:#b3aea4; --key-dark:#4c4b4e; --key-dark-edge:#222124;
  --key-text:#1d1c1a; --key-text-dark:#f1efe9; --key-ink:#1d1c1a; --key-mod:#6a6979; --key-mod-edge:#4a4958; --key-red-text:#b8211a; --led-idle:#6a6a6a; --led-off:#7a3a36;
  --shadow:3px 3px 0 var(--ink); --shadow-sm:2px 2px 0 var(--ink); --focus:0 0 0 3px var(--paper),0 0 0 5px var(--red);
  --font-pixel:'Press Start 2P','VT323',monospace;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --plastic:#232325; --paper:#303033; --paper-2:#3b3b3f; --ink:#ecebe6; --ink-soft:#b1aea7; --line:#57565c;
    --dark:#151517; --dark-2:#0e0e0f; --on-dark:#ecebe6; --on-dark-soft:#a6a39c;
    --red:#e93a30; --red-ink:#b3241c; --on-red:#fff; --good:#5fca7e; --warn:#e6ad45; --case:#4a494d;
    --shadow:3px 3px 0 #0a0a0b; --shadow-sm:2px 2px 0 #0a0a0b; --focus:0 0 0 3px var(--paper),0 0 0 5px var(--red);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --plastic:#232325; --paper:#303033; --paper-2:#3b3b3f; --ink:#ecebe6; --ink-soft:#b1aea7; --line:#57565c;
  --dark:#151517; --dark-2:#0e0e0f; --on-dark:#ecebe6; --on-dark-soft:#a6a39c;
  --red:#e93a30; --red-ink:#b3241c; --on-red:#fff; --good:#5fca7e; --warn:#e6ad45; --case:#4a494d;
  --shadow:3px 3px 0 #0a0a0b; --shadow-sm:2px 2px 0 #0a0a0b; --focus:0 0 0 3px var(--paper),0 0 0 5px var(--red);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--plastic);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--focus)}
h1,h2,h3{margin:0;font-weight:600}
.px{font-family:var(--font-pixel);font-size:9px;line-height:1.7;text-transform:uppercase;letter-spacing:0}
.px.lg{font-size:12px}
.muted{color:var(--ink-soft)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
#app{max-width:1400px;margin:0 auto;padding:18px 22px 80px}

/* ---- top bar: dark grey console plastic with two power LEDs -------------- */
.topbar{display:flex;align-items:center;gap:22px;flex-wrap:wrap;background:var(--dark);color:var(--on-dark);border:2px solid var(--ink);box-shadow:var(--shadow);padding:12px 16px 12px 18px}
.brand{display:flex;align-items:center;gap:14px}
.brand .mark{width:26px;height:26px;background:var(--red);border:2px solid var(--ink);box-shadow:inset -4px -4px 0 rgba(0,0,0,.25)}
.brand .name{font-family:var(--font-pixel);font-size:13px;line-height:1.2}
.brand .name small{display:block;font-family:var(--font-body);font-size:11px;font-weight:500;color:var(--on-dark-soft);margin-top:5px;letter-spacing:.04em;text-transform:uppercase}
.devtabs{display:flex;gap:10px;margin-left:auto}
.devtab{display:flex;align-items:center;gap:10px;font-family:var(--font-pixel);font-size:9px;text-transform:uppercase;padding:11px 14px;background:var(--dark-2);color:var(--on-dark-soft);border:2px solid var(--ink);box-shadow:var(--shadow-sm)}
.devtab[aria-selected="true"]{background:var(--paper);color:var(--ink)}
.devtab .led{width:10px;height:10px;border:2px solid var(--ink);background:var(--led-idle);flex:none}
.devtab .led.on{background:var(--good);box-shadow:0 0 6px var(--good)}
.devtab .led.off{background:var(--led-off)}
.topactions{display:flex;gap:10px}

.btn{font-family:var(--font-pixel);font-size:9px;text-transform:uppercase;padding:10px 12px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:var(--shadow-sm);line-height:1.6;white-space:nowrap}
.btn:hover{background:var(--paper-2)}
.btn:active,.btn.pressed{transform:translate(2px,2px);box-shadow:none}
.btn.red{background:var(--red);color:var(--on-red)} .btn.red:hover{background:var(--red-ink)}
.btn.dark{background:var(--dark);color:var(--on-dark)} .btn.dark:hover{background:var(--dark-2)}
.btn.ghost{box-shadow:none;background:transparent} .btn.ghost:hover{background:var(--paper-2)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--shadow-sm)}
.btn.sm{padding:7px 9px;font-size:8px}

/* ---- banner ---- */
.banner{margin-top:16px;padding:12px 16px;border:2px solid var(--ink);background:var(--paper);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.banner .tag{background:var(--red);color:var(--on-red);padding:4px 8px}
.banner code{font-family:var(--font-mono);background:var(--paper-2);padding:2px 6px}

/* ---- view layout ---- */
main{margin-top:20px}
.view{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.panel{background:var(--paper);border:2px solid var(--ink);box-shadow:var(--shadow);padding:18px}
.panel h2{font-family:var(--font-pixel);font-size:10px;text-transform:uppercase;line-height:1.7;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.panel h2::before{content:"";width:10px;height:10px;background:var(--red);border:2px solid var(--ink);flex:none}
.inspector{position:sticky;top:18px}
.full{grid-column:1 / -1}
.lead{font-size:15px;line-height:1.5}
.empty{padding:26px 8px;color:var(--ink-soft);text-align:center}
.empty .px{margin-bottom:12px;color:var(--ink)}

/* ---- keyboard illustration: N Edition keycaps on a grey case ---- */
.stage-kb{overflow-x:auto}
.kbd{--u:44px;--g:6px;display:inline-flex;flex-direction:column;gap:var(--g);padding:16px;background:var(--case);border:2px solid var(--key-ink);border-radius:8px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),var(--shadow)}
.row{display:flex;gap:var(--g)}
.key,.gap{width:calc(var(--w,1) * (var(--u) + var(--g)) - var(--g));height:var(--u);flex:none}
.key{position:relative;padding:0;overflow:hidden;border:2px solid var(--key-ink);border-radius:4px;background:var(--key-light);color:var(--key-text);--bevel:var(--key-light-edge);box-shadow:inset 0 -4px 0 var(--bevel);font-family:var(--font-body);font-weight:600;font-size:clamp(8px,calc(var(--u) * .27),11px);line-height:1.1;text-align:left;cursor:pointer;transition:transform .06s}
.key .leg{position:absolute;inset:2px 3px 5px;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre}
.key.mod{background:var(--key-mod);color:var(--key-text-dark);--bevel:var(--key-mod-edge)}
.key.arrow{background:var(--key-dark);--bevel:var(--key-dark-edge)}
.key.alpha{color:var(--key-red-text)}
.key.accent{background:var(--red);color:var(--on-red);--bevel:var(--red-ink)}
.key:focus-visible{box-shadow:inset 0 -4px 0 var(--bevel),var(--focus)}
.key:hover{transform:translateY(-2px)}
.key[aria-pressed="true"]{outline:3px solid var(--red);outline-offset:2px;transform:translateY(-2px)}
.key.mapped .leg{bottom:calc(var(--u) * .3 + 3px)}
.key.mod,.key.accent{font-size:clamp(7px,calc(var(--u) * .21),9px)}
.key.mod .leg,.key.accent .leg{text-transform:uppercase;letter-spacing:.03em}
.key.big{font-size:clamp(9px,calc(var(--u) * .33),14px)}
.key .map{position:absolute;left:2px;right:2px;bottom:3px;font-size:clamp(7px,calc(var(--u) * .21),9px);font-weight:600;background:var(--red);color:var(--on-red);padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-mono)}
.key .mc{position:absolute;top:2px;right:2px;width:13px;height:13px;background:var(--red);color:var(--on-red);font-family:var(--font-pixel);font-size:7px;line-height:13px;text-align:center;border:1px solid var(--key-ink)}
.super{display:flex;align-items:center;gap:22px;margin-top:16px;padding:14px 18px;background:var(--case);border:2px solid var(--key-ink);border-radius:8px;box-shadow:var(--shadow)}
.super .desc{flex:1;color:var(--ink)}
.pad{position:relative;display:flex;gap:30px;padding:12px 16px 16px;background:var(--key-light);border:2px solid var(--key-ink);border-radius:6px;box-shadow:inset 0 -4px 0 var(--key-light-edge);flex:none}
.pad::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:10px;margin-left:-5px;background:var(--key-dark-edge)}
.super .ports{display:flex;width:max-content;margin-top:8px;box-shadow:none}
.super .ports button{min-width:36px;padding:5px 10px}
.super .ports button.used::after{content:"";display:inline-block;width:5px;height:5px;margin-left:5px;vertical-align:middle;background:var(--red)}
.super .desc b{display:block;font-family:var(--font-pixel);font-size:8px;text-transform:uppercase;margin-bottom:4px}
.sbtn{position:relative;width:66px;height:66px;border-radius:50%;border:3px solid var(--key-ink);background:var(--red);color:var(--on-red);font-family:var(--font-pixel);font-size:14px;box-shadow:inset 0 -8px 0 var(--red-ink),0 3px 0 var(--key-ink);flex:none}
.sbtn:hover{transform:translateY(-2px)} .sbtn[aria-pressed="true"]{outline:3px solid var(--red);outline-offset:3px}
.sbtn:focus-visible{box-shadow:inset 0 -8px 0 var(--red-ink),var(--focus)}
.sbtn .map{position:absolute;left:50%;transform:translateX(-50%);bottom:-10px;max-width:84px;overflow:hidden;text-overflow:ellipsis;font-size:9px;font-family:var(--font-mono);font-weight:600;background:var(--red);color:var(--on-red);padding:1px 4px;white-space:nowrap;border:1px solid var(--key-ink)}
.sbtn .mc{position:absolute;top:-4px;right:-4px;width:16px;height:16px;background:var(--key-ink);color:var(--key-text-dark);font-family:var(--font-pixel);font-size:7px;line-height:16px;text-align:center;border:1px solid var(--key-ink)}

/* ---- inspector bits ---- */
.selhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.selhead .kname{font-family:var(--font-pixel);font-size:12px;line-height:1.5}
.selhead .knum{font-family:var(--font-mono);color:var(--ink-soft);font-size:12px}
.current{margin:0 0 14px;padding:10px 12px;background:var(--paper-2);border-left:4px solid var(--red)}
.current b{font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:0;margin-bottom:14px;border:2px solid var(--ink)}
.tabs button{flex:1;padding:9px 6px;border:0;background:var(--paper);font-family:var(--font-pixel);font-size:8px;text-transform:uppercase;border-right:2px solid var(--ink)}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{background:var(--dark);color:var(--on-dark)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{text-align:left;padding:9px 10px;border:2px solid var(--ink);background:var(--paper-2);font-weight:500;font-size:13px;line-height:1.3}
.tile small{display:block;color:var(--ink-soft);font-weight:400;font-size:11px;margin-top:2px}
.tile:hover{border-color:var(--red)}
.tile[aria-pressed="true"]{background:var(--red);color:var(--on-red)} .tile[aria-pressed="true"] small{color:var(--on-red);opacity:.85}
.tiles.three{grid-template-columns:repeat(3,1fr)}
.capture{border:2px dashed var(--ink);padding:16px 12px;text-align:center;background:var(--paper-2);cursor:text;min-height:64px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.capture[data-live="true"]{border-style:solid;border-color:var(--red)}
.capture .got{font-family:var(--font-pixel);font-size:11px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.field>label,.lbl{font-family:var(--font-pixel);font-size:8px;text-transform:uppercase;color:var(--ink-soft)}
.inp{border:2px solid var(--ink);background:var(--paper);padding:8px 10px;font-family:var(--font-mono);font-size:13px;width:100%;min-width:0}
.inp.sm{padding:5px 8px;font-size:12px}
select.inp{font-family:var(--font-body)}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.seg{display:inline-flex;align-self:flex-start;border:2px solid var(--ink);box-shadow:var(--shadow-sm)}
.seg button{padding:8px 12px;border:0;border-right:2px solid var(--ink);background:var(--paper);font-family:var(--font-mono);font-size:13px;font-weight:500;min-width:44px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--dark);color:var(--on-dark)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.inspector .seg button{padding:7px 9px;min-width:38px;font-size:12px;white-space:nowrap}
.switch{display:inline-flex;align-self:flex-start;align-items:center;gap:10px;padding:0;border:0;background:none;cursor:pointer;user-select:none}
.switch .track{width:46px;height:24px;border:2px solid var(--ink);background:var(--paper-2);position:relative;box-shadow:var(--shadow-sm)}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;background:var(--dark);transition:left .1s}
.switch[aria-checked="true"] .track{background:var(--red)} .switch[aria-checked="true"] .track::after{left:24px;background:var(--paper)}
.modrow{display:flex;gap:6px;flex-wrap:wrap}
.modrow .mod{padding:6px 9px;border:2px solid var(--ink);background:var(--paper-2);font-family:var(--font-mono);font-size:12px}
.modrow .mod[aria-pressed="true"]{background:var(--dark);color:var(--on-dark)}
.hint{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.4}
.divider{height:2px;background:var(--line);margin:16px 0;opacity:.6}

/* ---- macro editor ---- */
.steps{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto;border:2px solid var(--ink);padding:8px;background:var(--paper-2)}
.step{display:grid;grid-template-columns:22px 92px minmax(0,1fr) 28px;gap:6px;align-items:center}
.step .n{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);text-align:right}
.step .x{border:2px solid var(--ink);background:var(--paper);width:28px;height:28px;font-family:var(--font-pixel);font-size:8px;padding:0}
.steps .none{color:var(--ink-soft);font-size:12px;padding:6px}
.rec{background:var(--red);color:var(--on-red)} .rec[data-on="true"]{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
@media (prefers-reduced-motion:reduce){.rec[data-on="true"]{animation:none;outline:3px solid var(--red)}.key,.sbtn{transition:none}}

/* ---- settings grids ---- */
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.setting{display:flex;flex-direction:column;gap:8px}
.setting .name{font-weight:600}
.setting .desc{font-size:12px;color:var(--ink-soft);line-height:1.4}
.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inline>.inp{flex:1 1 140px;width:auto}

/* ---- mouse ---- */
.stage-mouse{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
.mouse-svg{width:100%;max-width:240px;display:block;margin:0 auto}
.mouse-svg .part{cursor:pointer}
.mouse-svg .part:hover .fill{stroke:var(--red);stroke-width:4}
.mouse-svg .part[aria-pressed="true"] .fill{stroke:var(--red);stroke-width:5}
.mouse-svg .static .fill{cursor:default}
.callouts{display:flex;flex-direction:column;gap:8px}
.callout{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:10px 12px;border:2px solid var(--ink);background:var(--paper-2)}
.callout:hover{border-color:var(--red)}
.callout[aria-pressed="true"]{outline:3px solid var(--red);outline-offset:1px}
.callout .idx{font-family:var(--font-pixel);font-size:9px;background:var(--dark);color:var(--on-dark);padding:6px 0;text-align:center;border:2px solid var(--ink)}
.callout .fn{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft)}
.callout .fn b{color:var(--ink);font-weight:600}
.callout .chip{font-family:var(--font-pixel);font-size:7px;text-transform:uppercase;background:var(--red);color:var(--on-red);padding:5px 6px;border:1px solid var(--ink)}
.callout.static{opacity:.75;cursor:default} .callout.static:hover{border-color:var(--ink)}
.fnlist{max-height:380px;overflow:auto;border:2px solid var(--ink);background:var(--paper-2)}
.fnlist .grp{font-family:var(--font-pixel);font-size:7px;text-transform:uppercase;padding:8px 10px 4px;color:var(--ink-soft);position:sticky;top:0;background:var(--paper-2)}
.fnlist button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:7px 10px;border:0;border-top:1px solid var(--line);background:transparent;font-size:13px}
.fnlist button:hover{background:var(--paper)}
.fnlist button[aria-pressed="true"]{background:var(--red);color:var(--on-red)}
.fnlist button .v{font-family:var(--font-mono);font-size:11px;opacity:.6}
.dpi{display:grid;grid-template-columns:auto auto 1fr 84px;gap:8px 12px;align-items:center}
.dpi .hd{font-family:var(--font-pixel);font-size:7px;text-transform:uppercase;color:var(--ink-soft)}
.dpi .inline{flex-wrap:nowrap}
.dpi input[type=range]{flex:1;min-width:0;accent-color:var(--red)}
.dpi input[type=checkbox],.dpi input[type=radio]{accent-color:var(--red);width:18px;height:18px;margin:0}
.dpi .slot{font-family:var(--font-mono);font-size:12px}
.wheelspeed{display:flex;align-items:center;gap:12px}
.wheelspeed input[type=range]{flex:1;accent-color:var(--red)}
.status{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);margin-bottom:12px}
.status b{color:var(--ink);font-weight:500}

/* ---- toast ---- */
#toast{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:10}
.tst{background:var(--dark);color:var(--on-dark);border:2px solid var(--ink);box-shadow:var(--shadow);padding:10px 14px;font-size:13px;max-width:360px}
.tst.err{background:var(--red);color:var(--on-red)}
.tst .px{display:block;margin-bottom:4px;font-size:7px;opacity:.8}

@media (max-width:1120px){.view{grid-template-columns:minmax(0,1fr)}.inspector{position:static}.stage-mouse{grid-template-columns:minmax(0,1fr)}}
</style>

<div id="app">
  <header class="topbar">
    <div class="brand"><div class="mark" aria-hidden="true"></div>
      <h1 class="name">RETRO CONFIG<small>8BitDo Retro 87 keyboard · Retro R8 mouse</small></h1></div>
    <div class="devtabs" role="tablist" aria-label="Device">
      <button class="devtab" role="tab" data-act="dev" data-arg="keyboard" aria-selected="true"><span class="led" id="led-kb"></span>Keyboard</button>
      <button class="devtab" role="tab" data-act="dev" data-arg="mouse" aria-selected="false"><span class="led" id="led-mouse"></span>Mouse</button>
    </div>
    <div class="topactions">
      <button class="btn" data-act="refresh" title="Read both devices again">Refresh</button>
      <button class="btn" data-act="theme" title="Switch light / dark">Theme</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main>
    <section id="view-keyboard" class="view"></section>
    <section id="view-mouse" class="view" hidden></section>
  </main>
</div>
<div id="toast" aria-live="polite"></div>

<script>
/*__META__*/
(function(){
'use strict';
const META = window.META;
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------------------------------------------------------------- data ---- */
const KEYS = {}; META.keys.forEach(k => KEYS[k.name] = k.code);
const KEY_NAME = {}; META.keys.forEach(k => KEY_NAME[k.code] = k.name);
Object.entries(META.extra_keys).forEach(([n,c]) => { KEYS[n] = c; KEY_NAME[c] = n; });
const MODS = ['left_ctrl','left_shift','left_alt','left_gui','right_ctrl','right_shift','right_alt','right_gui'];

/* 87-key TKL layout: [name, width, class] ; {gap:n} */
const L = (n,w,c) => ({n, w:w||1, c:c||''}), G = w => ({gap:w});
const LAYOUT = [

function codeToName(code){

function superOf(n){ const m = /^k([1-8])$/.exec(n || ''); return m ? {port:(+m[1]-1) >> 1, btn:(+m[1] % 2) ? 'A' : 'B'} : null; }
function prettyKey(n){
  if (!n) return '';

  if (/^f\d+$/.test(n) || n.length === 1) return n.toUpperCase();

function prettyTarget(t){

  if (t.startsWith('mouse:')) { const a = t.slice(6); return 'Mouse · ' + (MOUSE_PRETTY[a] || MOUSE_PRETTY['mouse_'+a] || a); }
  if (t.includes('+')) { const [m,k] = t.split('+'); return prettyKey(m) + ' + ' + prettyKey(k); }

}

/* --------------------------------------------------------------- state ---- */
let state = {keyboard:null, mouse:null, errors:{}};
let demo = false;
const ui = {device:'keyboard', kbKey:null, kbTab:'key', port:0, captured:null, mod:'', mouseBtn:null, mouseTab:'function', fnSearch:'', linkY:true,
            macro:null, recording:false, lastEvt:0};

async function loadState(){
  try{
    const r = await fetch('/api/state', {headers:{'X-Requested-With':'retro-config'}});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    state = await r.json(); demo = false;
  }catch(e){
    if (window.DEMO_STATE){ state = clone(window.DEMO_STATE); demo = true; }
    else state = {keyboard:null, mouse:null, errors:{keyboard:'Cannot reach the local server', mouse:'Cannot reach the local server'}};
  }
  render();
}
async function act(device, action, body, okMsg){
  if (demo){ demoApply(device, action, body); render(); toast(okMsg || 'Changed', 'Demo mode · kept in this page only'); return true; }
  try{
    const r = await fetch('/api/' + device + '/' + action, {method:'POST', headers:{'Content-Type':'application/json','X-Requested-With':'retro-config'}, body:JSON.stringify(body || {})});
    const j = await r.json();
    if (!j.ok){ toast(j.error || 'The device refused the change', 'Not saved', true); return false; }
    state[device] = j[device]; render(); toast(okMsg || 'Saved to the ' + device); return true;
  }catch(e){ toast('Lost the connection to 8bitdo-cfg ui. Is it still running?', 'Not saved', true); return false; }
}
function demoApply(device, action, b){
  const s = state[device]; if (!s) return;
  if (device === 'keyboard'){
    const key = typeof b.key === 'number' ? b.key : KEYS[b.key];
    if (action === 'map'){ if (b.target === key_name_of(key)) delete s.mappings[key]; else s.mappings[key] = {key, key_name:key_name_of(key), kind:7, value:[0,0,0,0], target:b.target}; }
    else if (action === 'unmap') delete s.mappings[key];
    else if (action === 'macro') s.macros[key] = {key, key_name:key_name_of(key), name:b.name, cycles: b.repeat === 'hold' ? 255 : +b.repeat, interval_ms:+b.interval_ms, steps:b.steps};
    else if (action === 'macro_clear') delete s.macros[key];
    else if (action === 'volume') s.volume = +b.level;
    else if (action === 'name') s.profile_name = b.name;
    else if (action === 'reset'){ s.mappings = {}; s.macros = {}; s.profile_name = ''; }
  } else {
    const btn = s.buttons.find(x => x.index === b.button || x.name === b.button);
    if (action === 'dpi'){ const t = {enabled_mask:b.enabled_mask, values:b.values}; if (b.axis !== 'y') s.dpi_x = clone(t); if (b.axis !== 'x') s.dpi_y = clone(t); }
    else if (action === 'dpi_slot') s.dpi_index = +b.slot;
    else if (action === 'rate') s.rate.current = s.rate.values.indexOf(+b.hz);
    else if (action === 'lod') s.lod = +b.mm;
    else if (action === 'wheel_speed') s.wheel_speed = +b.value;
    else if (action === 'wheel_direction') s.wheel_direction = b.reversed ? 1 : 0;
    else if (action === 'left_hand') s.left_hand = b.on ? 1 : 0;
    else if (action === 'button' && btn){ const f = META.r8_functions.find(x => x.name === b.function || x.value === b.function); btn.function = f ? f.value : 255; btn.function_name = f ? f.name : 'unused'; btn.macro_enabled = 0; }
    else if (action === 'macro' && btn){ btn.macro_enabled = 1; s.macros = s.macros.filter(m => m.button !== btn.index); s.macros.push({button:btn.index, button_name:btn.name, name:b.name, cycles:b.repeat === 'hold' ? 65535 : +b.repeat, interval_ms:+b.interval_ms, slot:btn.index-2, steps:b.steps}); }
    else if (action === 'macro_off' && btn){ btn.macro_enabled = 0; }
    else if (action === 'name') s.profile_name = b.name;
    else if (action === 'reset'){ Object.assign(s, clone(window.DEMO_STATE.mouse), {profile_name:''}); }
  }
}
function key_name_of(code){ return KEY_NAME[code] || String(code); }

/* -------------------------------------------------------------- toasts ---- */
function toast(msg, eyebrow, err){
  const el = document.createElement('div'); el.className = 'tst' + (err ? ' err' : '');
  el.innerHTML = (eyebrow ? '<span class="px">' + esc(eyebrow) + '</span>' : '') + esc(msg);
  $('#toast').appendChild(el); setTimeout(() => el.remove(), err ? 6000 : 3200);
}

/* -------------------------------------------------------------- render ---- */
// Re-rendering replaces the focused control; these put focus back on its replacement.
function focusSel(){
  const f = document.activeElement;
  if (!f || !f.closest || !f.closest('main')) return null;
  if (f.id) return '#' + CSS.escape(f.id);
  if (!f.dataset.act) return null;
  return '[data-act="' + f.dataset.act + '"]' + (f.dataset.arg === undefined ? '' : '[data-arg="' + CSS.escape(f.dataset.arg) + '"]');
}
function refocus(sel){
  if (!sel || (document.activeElement && document.activeElement !== document.body)) return;
  const el = $('main ' + sel); if (el) el.focus({preventScroll:true});
}
function render(){
  const fsel = focusSel();
  render_();
  refocus(fsel);
}
function render_(){
  const kb = state.keyboard, ms = state.mouse;
  $('#led-kb').className = 'led ' + (kb ? 'on' : 'off');
  $('#led-mouse').className = 'led ' + (ms ? 'on' : 'off');
  document.querySelectorAll('.devtab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.arg === ui.device)));
  const banner = $('#banner');
  if (demo){ banner.hidden = false; banner.innerHTML = '<span class="tag px">Demo</span><span>No local server reached, so this page shows <b>sample settings</b>. Run <code>8bitdo-cfg ui</code> on the machine the devices are plugged into to control them for real.</span>'; }
  else if (!kb && !ms){ banner.hidden = false; banner.innerHTML = '<span class="tag px">No device</span><span>Neither device was found. Plug them in over USB, then <b>Refresh</b>. If they are plugged in, make sure the udev rule from <code>udev/70-8bitdo.rules</code> is installed so <code>/dev/hidraw*</code> is readable.</span>'; }
  else banner.hidden = true;
  const other = $('#view-' + (ui.device === 'keyboard' ? 'mouse' : 'keyboard'));
  other.hidden = true; other.innerHTML = ''; // its stale forms would shadow ids like #macro-name
  $('#view-' + ui.device).hidden = false;
  if (ui.device === 'keyboard') renderKeyboardView(); else renderMouseView();
}

function keyHtml(kb, k, selected){
  const code = KEYS[k.n]; const map = kb.mappings[code]; const mac = kb.macros[code];
  const alpha = /^[a-z]$/.test(k.n), big = alpha || k.n === 'key_a' || k.n === 'key_b';
  const leg = map ? LEGENDSHORT(k.n) : (LEGEND[k.n] !== undefined ? LEGEND[k.n] : k.n.toUpperCase()); // mapped: one line above the badge
  return '<button class="key ' + k.c + (alpha ? ' alpha' : '') + (big ? ' big' : '') + (map ? ' mapped' : '') + '" style="--w:' + k.w + '" data-act="selkey" data-arg="' + code + '" aria-pressed="' + (selected === code) + '" title="' + esc(prettyKey(k.n)) + (map ? ' → ' + esc(prettyTarget(map.target)) : '') + '">' +
    '<span class="leg">' + esc(leg) + '</span>' + (map ? '<span class="map">' + esc(shortTarget(map.target)) + '</span>' : '') + (mac ? '<span class="mc" title="Macro: ' + esc(mac.name) + '">M</span>' : '') + '</button>';

function macroFromServer(m){
  if (!m) return {name:'', repeat:'1', interval_ms:0, steps:[]};
  return {name:m.name, repeat:(m.cycles === 255 || m.cycles === 65535) ? 'hold' : String(m.cycles), interval_ms:m.interval_ms, steps:m.steps.map(s => { const i = s.indexOf(':'); return {op:s.slice(0,i), arg:s.slice(i+1)}; })};
}
function ensureMacro(device, id, existing){
  if (!ui.macro || ui.macro.device !== device || ui.macro.id !== id){ ui.macro = Object.assign({device, id}, macroFromServer(existing)); }
  return ui.macro;
}
function macroEditorHtml(device, id, existing){

  h += '<div class="field"><label>Events (' + m.steps.length + ' of ' + (isMouse ? META.mouse_macro_max : META.kb_macro_max) + ')</label><div class="steps">' +

  h += '<div class="field"><label>Repeat</label><div class="inline"><div class="seg">' + [['1','Once'],['2','2×'],['3','3×'],['5','5×'],['10','10×'],['hold', isMouse ? 'Loop' : 'While held']].map(([v,l]) => '<button data-act="repeat" data-arg="' + v + '" aria-pressed="' + (m.repeat === v) + '">' + l + '</button>').join('') + '</div></div></div>';
  if (isMouse) h += '<p class="hint">Loop runs until another mouse button is pressed; the mouse has no "while held" macro mode. For a burst of clicks per press use a count with a short pause instead.</p>';
  h += '<div class="field"><label>Pause between repeats (ms)</label><input class="inp sm" type="number" min="0" max="65535" id="macro-interval" value="' + m.interval_ms + '" style="width:120px"></div>';

function macroSteps(){ return ui.macro.steps.map(s => s.op + ':' + String(s.arg).trim().toLowerCase()); }
function recordEvent(e){
  if (!ui.recording || !ui.macro) return;

  e.preventDefault();

  if (ui.lastEvt){ const d = Math.round(now - ui.lastEvt); if (d >= 5) ui.macro.steps.push({op:'delay', arg:String(Math.min(65535, d))}); }

async function backup(device){

  const blob = new Blob([JSON.stringify(cfg, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '8bitdo-' + device + '-' + new Date().toISOString().slice(0,10) + '.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Backup downloaded');
}
document.addEventListener('click', async e => {

  if (act === 'dev'){ ui.device = arg; ui.recording = false; render(); }

  else if (act === 'kbname'){ await act_('keyboard', 'name', {name:$('#kb-name').value}, 'Profile name saved'); }
  else if (act === 'msname'){ await act_('mouse', 'name', {name:$('#ms-name').value}, 'Profile name saved'); }
  else if (act === 'backup'){ await backup(arg); }

  else if (act === 'repeat'){ ui.macro.repeat = arg; renderInspector(); }
  else if (act === 'macrosave'){
    ui.macro.name = $('#macro-name').value; ui.macro.interval_ms = +$('#macro-interval').value || 0; ui.recording = false;
    const steps = macroSteps().filter(s => !s.endsWith(':'));
    if (!steps.length){ toast('Add at least one event first', 'Macro', true); return; }
    const dev = ui.macro.device, id = ui.macro.id;
    const ok = await act_(dev, 'macro', {[dev === 'keyboard' ? 'key' : 'button']:id, name:ui.macro.name || 'macro', repeat:ui.macro.repeat, interval_ms:ui.macro.interval_ms, steps}, 'Macro saved');
    if (ok) ui.macro = null;
  }
  else if (act === 'macroclear'){ const dev = ui.macro.device, id = ui.macro.id; const ok = await act_(dev, dev === 'keyboard' ? 'macro_clear' : 'macro_off', {[dev === 'keyboard' ? 'key' : 'button']:id}, dev === 'keyboard' ? 'Macro removed' : 'Macro switched off'); if (ok) ui.macro = null; }
  else if (act === 'macroon'){ const b = state.mouse.buttons.find(x => x.index === ui.mouseBtn); const m = state.mouse.macros.find(x => x.button === ui.mouseBtn); if (b && m) await act_('mouse', 'macro', {button:b.index, name:m.name, repeat:(m.cycles === 65535 ? 'hold' : String(m.cycles)), interval_ms:m.interval_ms, steps:m.steps}, 'Macro switched on'); }
  else if (act === 'selbtn'){ ui.mouseBtn = +arg; ui.macro = null; ui.recording = false; ui.fnSearch = ''; if (!MACRO_BTNS.includes(ui.mouseBtn)) ui.mouseTab = 'function'; render(); }
  else if (act === 'mstab'){ ui.mouseTab = arg; ui.recording = false; renderInspector(); }
  else if (act === 'setfn'){ await act_('mouse', 'button', {button:ui.mouseBtn, function:+arg}, (R8_BTN_PRETTY[state.mouse.buttons.find(x => x.index === ui.mouseBtn).name]) + ' → ' + fnLabel(+arg)); }
  else if (act === 'dpiactive'){ await act_('mouse', 'dpi_slot', {slot:+arg}, 'Active DPI: slot ' + (+arg + 1)); }
  else if (act === 'dpion'){ /* draft only; saved with the table */ }
  else if (act === 'dpisave'){ const d = dpiDraft(); await act_('mouse', 'dpi', {axis:'both', values:d.values, enabled_mask:d.enabled_mask}, 'DPI slots saved'); }
  else if (act === 'rate'){ await act_('mouse', 'rate', {hz:+arg}, arg + ' Hz'); }
  else if (act === 'lod'){ await act_('mouse', 'lod', {mm:+arg}, 'Lift-off ' + arg + ' mm'); }
  else if (act === 'wheeldir'){ await act_('mouse', 'wheel_direction', {reversed: el.getAttribute('aria-checked') !== 'true'}, 'Wheel direction saved'); }
  else if (act === 'lefthand'){ await act_('mouse', 'left_hand', {on: el.getAttribute('aria-checked') !== 'true'}, 'Left-hand mode saved'); }
});
async function act_(device, action, body, msg){
  const el = document.activeElement; if (el && el.classList) el.classList.add('pressed');
  try{ return await act(device, action, body, msg); }
  finally{ if (el && el.classList) el.classList.remove('pressed'); } // a failed write does not re-render
}
document.addEventListener('change', async e => {
  const el = e.target; const act = el.dataset.act; if (!act) return;
  if (act === 'pickkey'){ ui.captured = el.value || null; renderInspector(); }
  else if (act === 'stepop'){ const st = ui.macro.steps[+el.dataset.arg]; st.op = el.value; if (st.op === 'delay' && !/^\d+$/.test(st.arg)) st.arg = '50'; if (st.op === 'click' && !['left','right','middle','back','forward'].includes(st.arg)) st.arg = 'left'; renderInspector(); }
  else if (act === 'stepval'){ ui.macro.steps[+el.dataset.arg].arg = el.value; }
  else if (act === 'dpirange'){ const n = document.querySelector('[data-act="dpinum"][data-arg="' + el.dataset.arg + '"]'); if (n) n.value = el.value; }
  else if (act === 'dpinum'){ const r = document.querySelector('[data-act="dpirange"][data-arg="' + el.dataset.arg + '"]'); if (r) r.value = el.value; }
  else if (act === 'wheelspeed'){ await act('mouse', 'wheel_speed', {value:+el.value}, 'Wheel speed ' + el.value); }
  else if (act === 'restore'){
    const f = el.files[0]; if (!f) return;
    try{ const cfg = JSON.parse(await f.text()); if (confirm('Write "' + f.name + '" to the ' + el.dataset.arg + '? Current settings will be overwritten.')) await act(el.dataset.arg, 'apply', {config:cfg}, 'Backup restored'); }
    catch(err){ toast('That file is not a valid backup', 'Restore failed', true); }
    el.value = '';
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.act === 'dpirange'){ const n = document.querySelector('[data-act="dpinum"][data-arg="' + el.dataset.arg + '"]'); if (n) n.value = el.value; }
  else if (el.dataset.act === 'wheelspeed'){ const v = $('#wheelval'); if (v) v.textContent = el.value; }
  else if (el.id === 'fn-search'){ ui.fnSearch = el.value; const list = $('.fnlist'); if (list){ const tmp = document.createElement('div'); tmp.innerHTML = mouseInspectorHtml(state.mouse); const nl = tmp.querySelector('.fnlist'); if (nl) list.replaceWith(nl); } }
  else if (el.id === 'macro-name' && ui.macro) ui.macro.name = el.value;
  else if (el.id === 'macro-interval' && ui.macro) ui.macro.interval_ms = +el.value || 0;
});
document.addEventListener('keydown', e => {
  if (ui.recording){ recordEvent(e); return; }
  const cap = $('#capture');
  if (cap && document.activeElement === cap){ const n = codeToName(e.code); if (n){ e.preventDefault(); ui.captured = n; renderInspector(); $('#capture').focus(); } }
});
document.addEventListener('keyup', e => { if (ui.recording) recordEvent(e); });
document.addEventListener('focusin', e => { if (e.target.id === 'capture' && !ui.captured) e.target.querySelector('.got').textContent = 'waiting for a key…'; });

try{ const t = localStorage.getItem('rc-theme'); if (t) document.documentElement.setAttribute('data-theme', t); }catch(_){}
{ const h = new URLSearchParams(location.hash.replace(/^#/, '').replace(/^mouse$/, 'device=mouse'));
  if (h.get('device') === 'mouse') ui.device = 'mouse';
  if (h.get('key')){ ui.device = 'keyboard'; ui.kbKey = +h.get('key'); const s = superOf(KEY_NAME[ui.kbKey]); if (s) ui.port = s.port; }
  if (h.get('button')){ ui.device = 'mouse'; ui.mouseBtn = +h.get('button'); ui.mouseTab = h.get('tab') || 'function'; }
  if (h.get('tab') && ui.device === 'keyboard') ui.kbTab = h.get('tab'); }
loadState();
})();
