[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eightbitdo"
version = "0.1.0"
description = "Configure the 8BitDo Retro 87 Mechanical Keyboard and Retro R8 Mouse on Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aniket Chadalavada" }]
keywords = ["8bitdo", "keyboard", "mouse", "hidraw", "linux"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ThatCrispyToast/8bitdo_linux"
Issues = "https://github.com/ThatCrispyToast/8bitdo_linux/issues"

[project.scripts]
8bitdo-cfg = "eightbitdo.cli:main"

[tool.setuptools.packages.find]
include = ["eightbitdo*"]

[tool.setuptools.package-data]
eightbitdo = ["ui/*.html", "ui/*.svg", "ui/*.desktop", "ui/fonts/*.woff2", "ui/fonts/LICENSE.txt", "udev/*.rules"]
